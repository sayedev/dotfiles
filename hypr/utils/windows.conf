windowrule = suppress_event maximize, match:class .*
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false
windowrule = stay_focused on, match:class (Rofi)
windowrule = center on, match:class (Code|Electron), match:float true
windowrule = tile on, match:class (Code|Electron), match:title ^(Open .*)$

# GAMES
$anticheat = ^(.*EasyAntiCheat.*)$
$gameTitles = ^(HELLDIVE.*|A.*R.*C.*|Warframe)$
# Stash anti-cheat windows
windowrule = workspace 8 silent, match:class ^(steam_app_.*)$, match:title $anticheat
windowrule = workspace 8 silent, match:class ^(steam_app_.*)$, match:title negative:$gameTitles
# Render games to workspace 2
windowrule = workspace 2 silent, match:title $gameTitles, match:class ^(steam_app_.*)$
windowrule = fullscreen_state 2 2, match:title $gameTitles, match:class ^(steam_app_.*)$, match:float false
windowrule = tag +game, match:title $gameTitles, match:class ^(steam_app_.*)$
windowrule = decorate off, match:title $gameTitles, match:class ^(steam_app_.*)$
windowrule = rounding 0, match:title $gameTitles, match:class ^(steam_app_.*)$
windowrule = render_unfocused on, match:title $gameTitles, match:class ^(steam_app_.*)$
windowrule = immediate on, match:title $gameTitles, match:class ^(steam_app_.*)$
