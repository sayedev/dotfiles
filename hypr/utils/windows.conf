windowrule = suppress_event maximize, match:class .*
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false
windowrule = stay_focused on, match:class (Rofi)
windowrule = float on, center on, match:class (Code|Electron), match:float true
windowrule = tile on, match:class (Code|Electron), match:title ^(Open .*)$

# GAMESw
# ACTUAL GAMES - specific games go to workspace 2 actively (CHECK FIRST!)
windowrule = monitor DP-2, match:class ^(steam_app_.*)$
windowrule = workspace 2, match:class ^(steam_app_.*)$
windowrule = fullscreen_state 2 2, match:class ^(steam_app_.*)$
windowrule = content game, match:class ^(steam_app_.*)$
windowrule = decorate off, match:class ^(steam_app_.*)$
windowrule = border_size 0, match:class ^(steam_app_.*)$
windowrule = rounding 0, match:class ^(steam_app_.*)$
windowrule = render_unfocused on, match:class ^(steam_app_.*)$
windowrule = immediate on, match:class ^(steam_app_.*)$
