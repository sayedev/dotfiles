$font = Monospace

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    vibrancy = 0.1
    brightness = 0.5
    contrast = 0.5
}

input-field {
    monitor = DP-2
    size = 25%, 5%
    outline_thickness = 3
    inner_color = rgba(255, 255, 255, 0.2)
    outer_color = rgba(0, 0, 0, 0.5)
    check_color = rgba(191, 26, 26, 1)
    fail_color = rgba(255, 224, 143, 1)
    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 8
    font_family = $font
    placeholder_text = ..HELL DIVER..
    fail_text = TREASON
    dots_spacing = 0.3
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = center
    valign = top
}

label {
    monitor = DP-2
    text = $LAYOUT[en,ar]
    font_size = 38
    onclick = hyprctl switchxkblayout all next
    position = 15, 15
    halign = left
    valign = left
}
