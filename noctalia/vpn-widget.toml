# Alias the ProtonVPN plugin bar widget as "vpn" so bars can reference it by a
# short name. The widget itself is provided by the "diver/vpn" plugin (see
# noctalia/plugins/vpn/); SETUP.sh installs and enables it, then adds "vpn" to
# your active bar automatically.
#
# This is a drop-in: Noctalia merges every *.toml in ~/.config/noctalia/, so it
# takes effect without editing your config.toml.
#
# Docs: https://docs.noctalia.dev/v5/bar/widgets/  (see: Plugin widgets)

[widget.vpn]
type = "diver/vpn:status"
